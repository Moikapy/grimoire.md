[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire-md"
dynamic = ["version"]
description = "Terminal reader for markdown notes and scripts, with a page graph and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "moikapy" }]
keywords = ["markdown", "terminal", "tui", "curses", "notes", "mcp"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/Moikapy/grimoire.md"
Issues = "https://github.com/Moikapy/grimoire.md/issues"

[project.scripts]
grimoire = "grimoire:run"

[tool.setuptools]
py-modules = ["grimoire"]

[tool.setuptools.dynamic]
version = { attr = "grimoire.__version__" }
